# Esempio di nginx davanti alla pagina (consigliato: HTTPS, cosi' la password non viaggia in chiaro).
# Con nginx davanti, nel .env lascia WEB_HOST=127.0.0.1 (il sito non e' raggiungibile direttamente) ma tieni comunque
# WEB_UTENTE / WEB_PASSWORD. Cambia server_name, poi:
#   sudo cp deploy/nginx-db-serio.conf /etc/nginx/sites-available/db-serio
#   sudo ln -s /etc/nginx/sites-available/db-serio /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d catalogo.example.com          (certificato HTTPS gratuito Let's Encrypt)
server {
    listen 80;
    server_name catalogo.example.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
